<!DOCTYPE html>
<html lang="en">
<head>    
    <title>web game agensi eza</title>   
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            text-align: center;
        }
        
        header {
            background: #222;
            color: white;
            padding: 25px;
        }
        
        section {
            padding: 25px;
        }
        
        .game-box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }
        
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .game-card {
    background-color: rgb(112, 217, 243);
    padding: 20px;
    margin: 12px auto;
    max-width: 450px;
    border-radius: 12px;
}

        </style>
        
<body>

    <header>
        <h1>🎮 Ezaza gaming</h1>
        <p>Studio game kreatif untuk semua</p>
    </header>


<section>
    <h2>Selamat Datang di Studio Kami!</h2>
    <p>Kami membuat game sederhana yang seru dan menyenangkan yang cocok di main kan oleh anak  anak.</p>
</section>



    <section>
    <h2>🎮 Game saya</h2>
    
    
    <div id="daftar-game"></div>

</section>






    


    <input type="text" id="paket" placeholder="basic / standard /premium">

    <button onclick="hitung()">hitung harga</button>
    <p id="hasil"></p>

    <script>
        function hitung() {
            let paket = document.getElementById("paket") .value;
            let harga;

            if (paket == "basic") {
                harga = 100_000;
            } else if ((paket == "standard")) {
                harga =  250_000;
            } else if ((paket === "premium")) {
                harga = 500_000;

            } else{
                harga = 0
            }

            document.getElementById("hasil").innerHTML = "harga paket:Rp" + harga;
        }

        for (let i = 1; i <= 3; i++) {
    document.write("🎮 Game ke-" + i + "<br>");
}
let namaGame = [
    "mengenal huruf",
    "belajar berhitung",
    "mengenal warna"
];

for (let i = 0; i < namaGame.length; i++) {
    document.getElementById("daftar-game").innerHTML +=
    "<div class='game-card'>" +
    "<h3>🎮 " + namaGame[i] + "</h3>" +
    "<p>Game dari studio saya</p>" +
    "</div>";
}

    </script>

    <footer>
        <p>web reza nih bwos</p>
    </footer>
    
</body>
</html>
